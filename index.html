<style>

.status.ok{background:var(--okbg);color:var(--okink)}
.status.bad{background:var(--badbg);color:var(--badink)}

.pill{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--okink)}.pill.bad{background:var(--badbg);color:var(--badink)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.idle{background:var(--press);color:var(--ink2)}
.t-ok{color:var(--ok)}.t-bad{color:var(--badink)}.t-warn{color:var(--warn)}
.note{font-size:13px;color:var(--ink2);line-height:1.45;margin:0}
.link{background:none;border:none;border-radius:6px;min-height:44px;padding:0 4px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--ink);text-align:left;display:inline-flex;align-items:center;align-self:flex-start}
.empty{padding:28px 16px;text-align:center;color:var(--ink2);font-size:15px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:448px;z-index:var(--z-toast);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;padding:0 6px 0 14px;min-height:56px;font-size:15px;font-weight:600;border-radius:14px;box-shadow:0 8px 24px rgba(20,20,20,.22);transform:translate(-50%,0);opacity:1;transition:transform .2s var(--ease-out),opacity .2s var(--ease-out)}
.toast.err{background:var(--bad)}
.toast.in{transform:translate(-50%,10px);opacity:0}
.toast.out{transform:translate(-50%,6px);opacity:0;transition-duration:.15s}
.toast button{min-height:44px;padding:0 14px;background:#fff;color:var(--ink);border:none;border-radius:10px;font-weight:600;font-size:15px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:var(--z-sheet);display:flex;align-items:flex-end;justify-content:center;transition:opacity .18s ease}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:90dvh;overflow:auto;transition:transform .24s var(--ease-drawer)}
.sheet-bg.in{opacity:0}.sheet-bg.in .sheet{transform:translateY(100%)}
.sheet-bg.out{opacity:0;transition-duration:.16s}.sheet-bg.out .sheet{transform:translateY(40%);transition-duration:.16s}
.flash{animation:flash .7s var(--ease-out)}
@keyframes flash{from{background:var(--okbg)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){
  .sheet,.cta,.btn,.opt,.cta2{transition-property:opacity,background-color!important}
  .toast{transition-property:opacity!important}
  .sheet-bg.in .sheet,.sheet-bg.out .sheet{transform:none}
  .toast.in,.toast.out{transform:translate(-50%,0)}
  .btn:active,.opt:active,.cta2:active,.cta:active{transform:none!important}
}
.offline{background:var(--warnbg);color:var(--warn);font-size:13px;font-weight:600;padding:8px 16px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{font-size:13px;color:var(--ink2);text-align:right;padding:10px 14px 8px;border-bottom:1px solid var(--line2);font-weight:500}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line2)}
table.t tr.tot td{font-weight:700;border-top:1px solid var(--line);border-bottom:none}
.cupo-in{width:64px;min-height:44px;text-align:right;padding:0 10px;font-size:16px;border:1px solid var(--edge);border-radius:10px;background:var(--surf)}
.cupo-in:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,20,20,.12)}
@media print{
  header.top,nav.tabs,.dock,.noprint,.toast,#overlay{display:none!important}
  #app{max-width:none;border:none}
  body{background:#fff}
  .box,.hero{border-color:#000}
}
</style>

<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toastBox" aria-live="polite"></div>
<script>
'use strict';
/* ================= TIPOS ================= */
const TT=[
  {id:'gen_d',label:'General Dama',free:false},{id:'gen_c',label:'General Cab',free:false},
  {id:'pcp_d',label:'Percápita Dama',free:false},{id:'pcp_c',label:'Percápita Cab',free:false},
  {id:'res_d',label:'Residente Dama',free:false},{id:'res_c',label:'Residente Cab',free:false},
  {id:'pres_d',label:'P. Res. Dama',free:false},{id:'pres_c',label:'P. Res. Cab',free:false},
  {id:'sil_t',label:'Silent Turista',free:false},{id:'sil_r',label:'Silent Residente',free:false},
  {id:'free_d',label:'Free Dama',free:true},{id:'free_c',label:'Free Cab',free:true}
];
const DENOMS=[20000,10000,5000,2000,1000,500,200,100];
const COMIS_ALPOGO_DEF=1200;
const TOLERANCIA=100; // una diferencia menor a $100 se considera "cuadra"
const getT=id=>TT.find(t=>t.id===id);

/* ================= FIREBASE (mismo proyecto que App Puerta) ================= */
const firebaseConfig={
  apiKey:"AIzaSyDYjdQw1YS2fGOb5EmwNSk8X-mGOtlUduQ",
  authDomain:"zebra-puerta.firebaseapp.com",
  projectId:"zebra-puerta",
  storageBucket:"zebra-puerta.firebasestorage.app",
  messagingSenderId:"953302953272",
  appId:"1:953302953272:web:ffea2258d872b34a6d25cd"
};
let db=null, fbError=null, INC=null;
try{
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  INC=n=>firebase.firestore.FieldValue.increment(n);
  if(db.enablePersistence) db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
}catch(e){fbError=e;}
const TS=()=>Date.now();

/* ================= ESTADO ================= */
let nocheId=null, noche=null, cajas=[], movs=[];
let online=navigator.onLine, loaded=false;
const pend={noche:false,cajas:false,movs:false};
const U={tab:'noche',view:null,caja:null,venta:{caja:null,tipo:null,tier:0,qty:1,verMas:false},toast:null,sheet:null,rendir:{entrego:''},busy:false,flash:null,ultimo:null};
let unsubs=[];
function clearSubs(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];pend.noche=pend.cajas=pend.movs=false;}
const pending=()=>pend.noche||pend.cajas||pend.movs;

function nocheRef(){return db.collection('calle_noches').doc(nocheId);}

/* ================= EQUIPO (lista general compartida con App Puerta: config/equipo) ================= */
// Cada RRPP tiene sus equipos (redes / calle / kosmos). Acá solo se muestran los de calle.
// alpogoPago:'redes' = sus ventas de Alpogo se le pagan en Redes, no en esta caja.
const EQUIPO_BASE={
  rrpp:[
    {nombre:'Renzo Pacher',equipos:['redes']},
    {nombre:'Milagros Marta',equipos:['redes'],alpogo:'Mili Marta'},
    {nombre:'Diego Abatte',equipos:['redes'],alpogo:'Diego Abbate'},
    {nombre:'Agustina Avallay',equipos:['redes','calle'],alpogoPago:'redes'},
    {nombre:'Julieta Davi',equipos:['redes'],alpogo:'Juli Davi'},
    {nombre:'Jazmin Barañano',equipos:['redes'],alpogo:'Jaz Barañano'},
    {nombre:'Valentina Gugliotti',equipos:['redes'],alpogo:'Vale Gugliotti'},
    {nombre:'Leonel Araujo',equipos:['redes'],alpogo:'Leo Araujo'},
    {nombre:'Milmei Ruiz',equipos:['redes']},
    {nombre:'Abril Casini',equipos:['calle']},
    {nombre:'Ivan Schnebeerger',equipos:['calle']},
    {nombre:'Pau Carena',equipos:['calle']},
    {nombre:'Yamila Minichelli',equipos:['calle'],alpogo:'Yami Minichelli'},
    {nombre:'Leandro Rodriguez',equipos:['calle'],alpogo:'Lean Rodriguez'},
    {nombre:'Juan Martin Elias',equipos:['calle']},
    {nombre:'Noah Farrer',equipos:['kosmos']},
    {nombre:'Bauti Toledo',equipos:['kosmos']},
    {nombre:'Emi Estarrona',equipos:['kosmos']},
    {nombre:'Emi Repetto',equipos:['kosmos']}
  ],
  encargado:['Facu Fernandez','Manu Contreras','Simón Callejón'],
  dueno:['Benja Peralta','Fabio Testi','Glenda Testi','Jonas Testi']
};
let equipo=JSON.parse(JSON.stringify(EQUIPO_BASE)), equipoGuardado=false;
const OTRO='__otro__';
const normN=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const persona=n=>(equipo.rrpp||[]).find(p=>normN(p.nombre)===normN(n));
const rrppCalle=()=>(equipo.rrpp||[]).filter(p=>(p.equipos||[]).includes('calle')).map(p=>p.nombre).sort((a,b)=>a.localeCompare(b,'es'));
const alpogoEnRedes=n=>{const p=persona(n);return !!(p&&p.alpogoPago==='redes');};
// Suma un RRPP nuevo de calle a la lista general (o le agrega "calle" si ya existía en otro equipo).
function altaRrppCalle(nombre){
  const lista=JSON.parse(JSON.stringify(equipo));
  const p=lista.rrpp.find(x=>normN(x.nombre)===normN(nombre));
  if(p){if((p.equipos||[]).includes('calle'))return p.nombre;p.equipos=[...(p.equipos||[]),'calle'];}
  else lista.rrpp.push({nombre,equipos:['calle']});
  equipo=lista;
  w(db.collection('config').doc('equipo').set(lista),'la lista de RRPP');
  return p?p.nombre:nombre;
}
function onErr(e){fbError=e;toast('Error de conexión con la base: '+(e.code||e.message||e),{err:true});render();}
function listen(){
  if(!db){loaded=true;render();return;}
  db.collection('config').doc('equipo').onSnapshot(s=>{if(s.exists){const d=s.data();equipo={rrpp:Array.isArray(d.rrpp)?d.rrpp:EQUIPO_BASE.rrpp,encargado:d.encargado||EQUIPO_BASE.encargado,dueno:d.dueno||EQUIPO_BASE.dueno};equipoGuardado=true;}if(U.view==='editCaja')return;liveRender();},()=>{});
  db.collection('config').doc('calle').onSnapshot(s=>{
    const id=s.exists?s.data().nocheActivaId:null;
    if(!id){if(nocheId){clearSubs();nocheId=null;noche=null;cajas=[];movs=[];}loaded=true;render();return;}
    if(id!==nocheId){
      nocheId=id;clearSubs();noche=null;cajas=[];movs=[];
      let lastNoche='';
      unsubs.push(nocheRef().onSnapshot({includeMetadataChanges:true},d=>{if(nocheId!==id)return;pend.noche=!!(d.metadata&&d.metadata.hasPendingWrites);const js=d.exists?JSON.stringify(d.data()):'';if(js===lastNoche&&loaded){updateSync();return;}lastNoche=js;noche=d.exists?{id:d.id,...d.data()}:null;loaded=true;liveRender();},onErr));
      unsubs.push(nocheRef().collection('cajas').onSnapshot({includeMetadataChanges:true},q=>{if(nocheId!==id)return;pend.cajas=!!(q.metadata&&q.metadata.hasPendingWrites);if(q.docChanges&&q.docChanges().length===0&&cajas.length){updateSync();return;}cajas=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.orden||0)-(b.orden||0));liveRender();},onErr));
      unsubs.push(nocheRef().collection('movs').onSnapshot({includeMetadataChanges:true},q=>{if(nocheId!==id)return;pend.movs=!!(q.metadata&&q.metadata.hasPendingWrites);if(q.docChanges&&q.docChanges().length===0&&movs.length){updateSync();return;}movs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));liveRender();},onErr));
    }
  },e=>{fbError=e;loaded=true;render();});
}

/* ================= UTILS ================= */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'−':'')+'$'+Math.round(Math.abs(n||0)).toLocaleString('es-AR');
// Montos en formato argentino: "35.000" = treinta y cinco mil; "1.250,50" = mil doscientos cincuenta con 50
function n0(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  let s=String(v==null?'':v).trim().replace(/[^\d.,-]/g,'');
  if(!s)return 0;
  s=s.replace(/\./g,'').replace(',','.');
  const x=parseFloat(s);return isFinite(x)?x:0;
}
const pint=v=>Math.max(0,Math.round(n0(v)));
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
// Fecha local (no UTC): una noche creada a las 23 h queda con la fecha de hoy
const hoyLocal=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const abrev=n=>{const p=String(n).trim().split(/\s+/);return p.length>1?p[0]+' '+p[1][0]+'.':p[0];};
// Nombre corto; si dos RRPP quedarían iguales ("Juan P."), muestra el nombre completo
const corto=n=>{const c=abrev(n);return cajas.filter(x=>abrev(x.nombre)===c).length>1?String(n).trim():c;};
const fechaTxt=f=>{if(!f)return'';const [y,m,d]=f.split('-');const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];const dt=new Date(+y,+m-1,+d);return dias[dt.getDay()]+' '+(+d)+'/'+(+m);};
const tipos=()=>{const a=noche&&noche.tipos&&noche.tipos.length?noche.tipos:TT.map(t=>t.id);return TT.filter(t=>a.includes(t.id));};
const precio=(tid,i)=>n0(((noche&&noche.precios&&noche.precios[tid])||[])[i]);
const preciosDe=tid=>((noche&&noche.precios&&noche.precios[tid])||[]).map(n0); // lista de precios de un tipo (Precio 1, Precio 2…)
const opcionesPrecio=tid=>preciosDe(tid).map((v,i)=>({i,v})).filter(x=>x.v>0);
const vivos=()=>movs.filter(m=>!m.anulada);
const cuadra=d=>Math.abs(d)<TOLERANCIA;
const difTexto=d=>cuadra(d)?'Cuadra':d<0?'Faltan '+fmt(-d):'Sobran '+fmt(d);

/* ================= CÁLCULOS ================= */
function calcCaja(c){
  const ms=vivos().filter(m=>m.caja===c.id);
  const ventas=ms.filter(m=>m.t==='venta');
  const porTipo={};
  ventas.forEach(v=>{porTipo[v.tipo]=porTipo[v.tipo]||{qty:0,total:0};porTipo[v.tipo].qty+=v.qty;porTipo[v.tipo].total+=v.total;});
  const qtyPaga=ventas.filter(v=>!(getT(v.tipo)||{}).free).reduce((s,v)=>s+v.qty,0);
  const qtyFree=ventas.filter(v=>(getT(v.tipo)||{}).free).reduce((s,v)=>s+v.qty,0);
  const vendido=ventas.reduce((s,v)=>s+v.total,0);
  const transfer=ms.filter(m=>m.t==='transfer').reduce((s,m)=>s+m.monto,0);
  const aCuenta=ms.filter(m=>m.t==='efectivo').reduce((s,m)=>s+m.monto,0);
  const gastos=ms.filter(m=>m.t==='gasto').reduce((s,m)=>s+m.monto,0);
  const alpogo=pint(c.alpogo);
  const comisAlpogo=c.comisAlpogo!=null?n0(c.comisAlpogo):COMIS_ALPOGO_DEF;
  const comision=qtyPaga*n0(c.comisTicket)+n0(c.fijo)+alpogo*comisAlpogo;
  const aEntregar=vendido-transfer-aCuenta-gastos;
  const entrego=c.entrego!=null?n0(c.entrego):null;
  const rendida=entrego!=null&&!c.reabierta;
  const diferencia=rendida?entrego-aEntregar:null;
  return {ms,ventas,porTipo,qtyPaga,qtyFree,vendido,transfer,aCuenta,gastos,alpogo,comisAlpogo,comision,aEntregar,entrego,rendida,reabierta:!!c.reabierta,diferencia};
}
function calcNoche(){
  const cs=cajas.map(c=>({c,k:calcCaja(c)}));
  const porTipo={};
  cs.forEach(({k})=>Object.entries(k.porTipo).forEach(([t,v])=>{porTipo[t]=porTipo[t]||{qty:0,total:0};porTipo[t].qty+=v.qty;porTipo[t].total+=v.total;}));
  const sum=f=>cs.reduce((s,x)=>s+f(x),0);
  const vendido=sum(x=>x.k.vendido), transfer=sum(x=>x.k.transfer);
  const efectivo=vendido-transfer;
  const qtyPaga=sum(x=>x.k.qtyPaga), qtyFree=sum(x=>x.k.qtyFree), alpogo=sum(x=>x.k.alpogo);
  const sueldos=sum(x=>x.k.comision);
  const sueldosCaja=sum(x=>x.c.pago==='caja'?x.k.comision:0);
  const sueldosZebra=sum(x=>x.c.pago==='zebra'?x.k.comision:0);
  const sueldosSinDef=sueldos-sueldosCaja-sueldosZebra;
  const gastosRRPP=sum(x=>x.k.gastos);
  const gastosClub=vivos().filter(m=>m.t==='gastoClub').reduce((s,m)=>s+m.monto,0);
  // Lo que el encargado recibió en mano hasta ahora (no cuenta cajas que todavía no rindieron)
  const recibido=sum(x=>x.k.aCuenta+(x.k.entrego!=null?x.k.entrego:0));
  const enMano=recibido-sueldosCaja-gastosClub;
  const b=(noche&&noche.billetes)||{};
  const contado=DENOMS.reduce((s,d)=>s+d*pint(b[d]),0);
  const hayConteo=DENOMS.some(d=>pint(b[d])>0);
  const difConteo=contado-enMano;
  const rendidas=cs.filter(x=>x.k.rendida);
  const pendientes=cs.filter(x=>!x.k.rendida);
  const difRRPP=rendidas.reduce((s,x)=>s+x.k.diferencia,0);
  const conDif=rendidas.filter(x=>!cuadra(x.k.diferencia));
  const faltaRendir=pendientes.reduce((s,x)=>s+x.k.aEntregar-(x.k.entrego||0),0);
  return {cs,porTipo,vendido,transfer,efectivo,qtyPaga,qtyFree,alpogo,sueldos,sueldosCaja,sueldosZebra,sueldosSinDef,gastosRRPP,gastosClub,recibido,enMano,contado,hayConteo,difConteo,rendidas,pendientes,difRRPP,conDif,faltaRendir};
}

/* ---------- CAJA ---------- */

function vCaja(){
  const c=cajas.find(x=>x.id===U.caja); if(!c) return hdrBack('Caja','','volver')+'<main><div class="empty">Cargando…</div></main>';

  const ct=U.carga||'transfer';
  const cupoRows=tipos().filter(t=>pint((c.cupos||{})[t.id])>0||(k.porTipo[t.id]||{}).qty).map(t=>{const a=pint((c.cupos||{})[t.id]);const v=(k.porTipo[t.id]||{}).qty||0;const q=a-v;const pas=a>0&&q<0;
    return `<tr ${pas?'style="background:var(--badbg)"':''}><td ${pas?'style="color:var(--badink);font-weight:600"':''}>${esc(t.label)}</td><td class="num">${a||'—'}</td><td class="num">${v}</td><td class="num" style="font-weight:700;${pas?'color:var(--badink)':''}">${a?(pas?(q+' pasado'):q):'—'}</td></tr>`;}).join('');
  const lista=k.ms.slice().reverse();
  const efCobrado=k.vendido-k.transfer;
  const sub=[c.qr?'QR '+esc(c.qr):'',k.reabierta?'Volver a rendir':k.rendida?'Caja rendida':''].filter(Boolean).join(' · ');
  const filaMov=m=>{let txt,monto,cls='';
    if(m.t==='venta'){const t=getT(m.tipo)||{label:m.tipo};txt=`${m.qty} ${esc(t.label)}${t.free?'':' · Precio '+((m.tier||0)+1)}`;monto=t.free?'free':fmt(m.total);}
    else if(m.t==='transfer'){txt='<b>Transferencia</b>';monto=fmt(m.monto);cls='t-ok';}
    else if(m.t==='efectivo'){txt='Efectivo a cuenta';monto=fmt(m.monto);}
    else{txt='Gasto'+(m.desc?': '+esc(m.desc):'');monto='−'+fmt(m.monto);cls='t-bad';}
    return `<div class="num" data-mov="${m.id}"><span class="m" style="width:44px;font-size:14px">${hhmm(m.ts)}</span><span class="grow">${txt}</span><span class="r ${cls}">${monto}</span>${delBtn(m.id,m.t==='venta'?'Anular venta':'Borrar movimiento')}</div>`;};
  return hdrBack(esc(c.nombre),sub,'volver',`<button class="link" data-a="editCaja" style="padding:0 8px;min-height:48px;align-self:center">Editar</button>`)+`<main>
    ${k.reabierta?`<div class="status warn">${I.alert} Hubo movimientos después de rendir. Volvé a rendir esta caja.</div>`:''}
    <section class="hero" style="display:flex;flex-direction:column;gap:12px">
      <div class="row-between" style="align-items:flex-end"><div><div class="lbl">Vendido en calle</div><div class="bebas num" style="font-size:33px;line-height:1">${fmt(k.vendido)}</div></div><div style="text-align:right"><div class="lbl">Entradas</div><div class="bebas num" style="font-size:33px;line-height:1">${k.qtyPaga}</div></div></div>
      <div class="grid2" style="gap:8px">
        <div style="background:var(--transfer);padding:10px 12px;border-radius:12px"><div class="lbl" style="color:var(--okink)">Transferencias</div><div class="bebas num" style="font-size:21px">${fmt(k.transfer)}</div></div>
        <div style="background:var(--cash);padding:10px 12px;border-radius:12px"><div class="lbl">Efectivo cobrado</div><div class="bebas num" style="font-size:21px">${fmt(efCobrado)}</div></div>
      </div>

    <section class="stack box" style="padding:12px;gap:10px">
      <div class="seg" role="group" aria-label="Qué cargar">${Object.entries(CARGAS).map(([key,v])=>`<button ${pr(ct===key)} data-a="tipoCarga" data-v="${key}">${v.lbl==='Efectivo a cuenta'?'Efectivo':v.lbl}</button>`).join('')}</div>
      <div style="display:flex;gap:8px">
        <input class="in num" id="qMonto" inputmode="decimal" placeholder="Monto $" autocomplete="off" style="flex:1;min-width:0;font-size:20px;font-weight:700" data-enter="anotarRapido">
        <button class="btn ink" data-a="anotarRapido" style="min-width:110px">Anotar</button>
      </div>
      ${ct==='gasto'?`<input class="in" id="qDesc" placeholder="¿En qué? (nafta, hielo…)" autocomplete="off" data-enter="anotarRapido">`:''}
      <p class="note">${ct==='transfer'?'Cada transferencia que entra a su Mercado Pago, de a una.':ct==='efectivo'?'Plata en efectivo que te da antes de rendir.':'Lo que gastó de la plata de la caja.'}</p>
    </section>

    <section class="stack"><div class="row-between"><h2 class="lbl">Movimientos</h2><span class="sub">${lista.length}</span></div>

    </section>

    ${alpogoEnRedes(c.nombre)?`<p class="note">Sus ventas de Alpogo se le pagan en Redes, no en esta caja.</p>`:`<section class="stack">
      <h2 class="lbl">Alpogo · solo para su comisión</h2>
      <div class="box" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px">
        <span style="font-size:15px">Vendidas por su link<br><span class="sub">La plata la cobra Alpogo, no esta caja</span></span>
        <div style="display:flex;align-items:center;gap:6px"><button class="btn" data-a="alpogo" data-v="-1" aria-label="Restar una de Alpogo" style="width:48px;padding:0;display:flex;align-items:center;justify-content:center">${I.minus}</button><span class="bebas num" style="font-size:22px;min-width:36px;text-align:center" aria-live="polite">${k.alpogo}</span><button class="btn" data-a="alpogo" data-v="1" aria-label="Sumar una de Alpogo" style="width:48px;padding:0;display:flex;align-items:center;justify-content:center">${I.plus}</button></div>

  </main>

}

/* ---------- RENDIR ---------- */
function statusRendir(k,entVal,listo){
  if(entVal==='')return'';
  if(!listo)return `<div class="status idle">Calculando…</div>`;
  const dif=n0(entVal)-k.aEntregar;
  return cuadra(dif)?`<div class="status ok">${I.check} Cuadra justo</div>`:dif<0?`<div class="status bad num">${I.alert} Faltan ${fmt(-dif)}</div>`:`<div class="status warn num">Sobran ${fmt(dif)}</div>`;
}
function notaPago(c,k,entVal){
  const ent=entVal===''?0:n0(entVal);
  const queda=ent+k.aCuenta-(c.pago==='caja'?k.comision:0);
  return c.pago==='caja'?`Se le dan ${fmt(k.comision)} del efectivo ahora. De esta caja quedan ${fmt(queda)} en mano.`:c.pago==='zebra'?'No sale de la caja: queda anotado como sueldo a pagar por Zebra.':'Obligatorio. Elegí según la plata que haya hoy.';
}
function vRendir(){
  const c=cajas.find(x=>x.id===U.caja); if(!c) return hdrBack('Rendir caja','','volver')+'<main><div class="empty">Cargando…</div></main>';
  const k=calcCaja(c);
  const entVal=U.rendir.entrego;
  const pago=c.pago||null;
  return hdrBack('Rendir caja',esc(c.nombre)+(c.qr?' · QR '+esc(c.qr):''),'volverCaja')+`<main>
    ${k.reabierta?`<div class="status warn">${I.alert} Ya había rendido ${fmt(k.entrego)}. Corregí el total entregado.</div>`:''}
    <section class="stack"><h2 class="lbl">1 · Cuánto tiene que entregar</h2>
      <div class="box list num">
        <div><span class="grow">Vendido en calle (${k.qtyPaga})</span><span class="r">${fmt(k.vendido)}</span></div>
        <div class="m"><span class="grow">− Transferencias</span><span>${fmt(k.transfer)}</span></div>
        <div class="m"><span class="grow">− Efectivo a cuenta</span><span>${fmt(k.aCuenta)}</span></div>
        <div class="m sep"><span class="grow">− Gastos</span><span>${fmt(k.gastos)}</span></div>
        <div style="min-height:60px"><span class="grow" style="font-weight:700">Efectivo a entregar</span><span class="bebas" style="font-size:25px">${fmt(k.aEntregar)}</span></div>
      </div>
      ${k.alpogo?`<p class="note">${k.alpogo===1?'La entrada de Alpogo se cobra':'Las '+k.alpogo+' entradas de Alpogo se cobran'} online: no pasa por esta caja.</p>`:''}
    </section>
    <section class="stack"><label class="lbl" for="entrego">2 · Efectivo que entregó${k.reabierta?' en total':''}</label>
      <p class="note" style="margin-top:-4px">Ya está puesto lo que corresponde. Cambialo solo si entregó otro monto.</p>
      <input class="in bigin num" id="entrego" inputmode="decimal" placeholder="$0" value="${esc(entVal)}" data-i="entrego" autocomplete="off">
      <div id="statEntrego" aria-live="polite">${statusRendir(k,entVal,true)}</div>
    </section>
    <section class="stack" id="secPago"><h2 class="lbl">3 · Su sueldo de hoy</h2>
      <div class="box list num">
        <div class="m"><span class="grow">Fijo</span><span>${fmt(c.fijo)}</span></div>
        <div class="m"><span class="grow">Calle ${k.qtyPaga} × ${fmt(c.comisTicket)}</span><span>${fmt(k.qtyPaga*n0(c.comisTicket))}</span></div>
        <div class="m sep"><span class="grow">Alpogo ${k.alpogo} × ${fmt(k.comisAlpogo)}</span><span>${fmt(k.alpogo*k.comisAlpogo)}</span></div>
        <div style="min-height:56px"><span class="grow" style="font-weight:700">Total a pagarle</span><span class="bebas" style="font-size:24px">${fmt(k.comision)}</span></div>
      </div>
      <div style="font-size:15px;font-weight:600" id="lblPago">¿De dónde sale hoy?</div>
      <div class="grid2" role="group" aria-labelledby="lblPago"><button class="opt tall" ${pr(pago==='caja')} data-a="pago" data-v="caja" style="justify-content:center">De la caja</button><button class="opt tall" ${pr(pago==='zebra')} data-a="pago" data-v="zebra" style="justify-content:center">Lo paga Zebra</button></div>
      <p class="note num ${pago?'':'t-warn'}" id="notaPago" style="${pago?'':'font-weight:600'}">${notaPago(c,k,entVal)}</p>
    </section>
  </main>
  <div class="dock"><button class="cta" data-a="cerrarCaja">${I.check} ${k.rendida?'Guardar cambios':'Cerrar caja'}</button></div>`;
}

      <div class="grid2"><button class="cta2" data-a="cerrarSheet">Cancelar</button><button class="cta" data-a="guardarBilletes" style="font-size:26px;min-height:64px">${I.check} Listo</button></div>`;
  }else if(s.k==='confirm'){

  if(first){const bg=o.querySelector('.sheet-bg');requestAnimationFrame(()=>requestAnimationFrame(()=>bg&&bg.classList.remove('in')));}

let toastT=null;
function renderToast(){
  const box=$('#toastBox');
  if(!U.toast){const t=box.querySelector('.toast');if(t){t.classList.add('out');setTimeout(()=>{if(!U.toast)box.innerHTML='';},160);}return;}
  const had=box.querySelector('.toast:not(.out)');
  box.innerHTML=`<div class="toast ${U.toast.err?'err':''} ${had?'':'in'}"><span>${esc(U.toast.msg)}</span>${U.toast.undo?`<button data-a="deshacer">Deshacer</button>`:''}</div>`;
  posToast();
  if(!had){const t=box.querySelector('.toast');requestAnimationFrame(()=>requestAnimationFrame(()=>t&&t.classList.remove('in')));}
}
// El aviso se ubica justo encima de los botones fijos de abajo (dock / pestañas), en cualquier pantalla
function posToast(){const el=document.querySelector('#toastBox .toast');if(!el)return;const H=innerHeight;
  const tops=[...document.querySelectorAll('.dock,nav.tabs')].map(e=>e.getBoundingClientRect()).filter(r=>r.height&&r.top<H&&r.bottom>H-140).map(r=>r.top);
  el.style.bottom=(tops.length?H-Math.min(...tops):0)+12+'px';}
function toast(msg,o){o=o||{};U.toast={msg,undo:!!o.undo,err:!!o.err};clearTimeout(toastT);toastT=setTimeout(()=>{U.toast=null;renderToast();},o.undo?6000:(o.err?5000:2600));renderToast();}
document.addEventListener('visibilitychange',()=>{ // con el celu bloqueado no se pierde el "Deshacer"
  if(document.hidden){clearTimeout(toastT);}else if(U.toast){clearTimeout(toastT);toastT=setTimeout(()=>{U.toast=null;renderToast();},3000);}
});

/* ================= PDF DE CIERRE (para mandar por WhatsApp) ================= */
const PDF_LIBS=['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'];
let pdfReady=null;
function cargarPdf(){
  if(pdfReady)return pdfReady;
  pdfReady=PDF_LIBS.reduce((pr,src)=>pr.then(()=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('pdf'));document.head.appendChild(s);})),Promise.resolve())
    .catch(e=>{pdfReady=null;throw e;});
  return pdfReady;
}
const pdfListo=()=>!!(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API&&window.jspdf.jsPDF.API.autoTable);
const fp=n=>fmt(n).replace(/−/g,'-');
function nombrePdf(){return ('Zebra_Calle_'+(noche.fecha||hoyLocal())+'_'+(noche.nombre||'noche')).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_')+'.pdf';}
function armarPdf(){
  // Hoja 1: rendición final con el formato que usa administración (entradas → cierre total → transferencia/efectivo → gastos → efectivo a entregar)
  // Hoja 2: anexo con el detalle por RRPP (sueldos y cajas)
  const N=calcNoche();
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const W=210,M=16,INK=[20,20,20],GRIS=[74,71,64],ROJO=[143,29,18],VERDE=[15,77,42];let y=0;
  const tabla=(head,body,opts)=>{opts=opts||{};const cs=opts.columnStyles||{};const extra=opts.didParseCell;
    opts.didParseCell=d=>{if(d.section==='head'&&cs[d.column.index]&&cs[d.column.index].halign)d.cell.styles.halign=cs[d.column.index].halign;if(extra)extra(d);};
    doc.autoTable(Object.assign({startY:y,head:head?[head]:undefined,showHead:head?'firstPage':false,body,theme:'grid',margin:{left:M,right:M},styles:{fontSize:10,cellPadding:2.2,textColor:20,lineColor:190,lineWidth:.25},headStyles:{fillColor:INK,textColor:255,fontStyle:'bold'}},opts));
    y=doc.lastAutoTable.finalY;};
  const titulo=t=>{doc.setTextColor(...INK);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(t,M,y);doc.setLineWidth(.5);doc.setDrawColor(...INK);doc.line(M,y+1.5,M+doc.getTextWidth(t),y+1.5);y+=6;};
  const caja=(label,monto,opt)=>{opt=opt||{};const h=opt.h||13;doc.setDrawColor(...INK);doc.setLineWidth(opt.grueso?.9:.5);if(opt.fill){doc.setFillColor(...opt.fill);doc.rect(M,y,W-2*M,h,'FD');}else doc.rect(M,y,W-2*M,h);
    doc.setFont('helvetica','bold');doc.setFontSize(opt.fs||12);doc.setTextColor(...(opt.color||INK));doc.text(label,M+4,y+h/2+1.6);
    doc.setFontSize(opt.fsm||16);doc.text(monto,W-M-4,y+h/2+2,{align:'right'});doc.setTextColor(...INK);y+=h;};
  const linea=(label,monto,opt)=>{opt=opt||{};doc.setFont('helvetica',opt.bold?'bold':'normal');doc.setFontSize(opt.fs||11);doc.setTextColor(...(opt.color||INK));doc.text(label,M+(opt.ind||4),y);doc.text(monto,W-M-4,y,{align:'right'});doc.setTextColor(...INK);y+=opt.gap||6.5;};
  const encabezado=(sub)=>{doc.setFillColor(...INK);doc.rect(0,0,W,22,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(17);doc.text('ZEBRA CLUB · RENDICIÓN DE CALLE',M,10.5);
    doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.text(`${fechaTxt(noche.fecha)} · ${noche.nombre||''}`,M,17.5);doc.text(sub,W-M,17.5,{align:'right'});doc.setTextColor(...INK);y=32;};

  // ================= HOJA 1 =================
  encabezado('Rendición final');
  // ---- ENTRADAS (cantidad × valor = total), una fila por tipo y precio ----
  titulo('ENTRADAS');
  const grupos={};
  vivos().filter(m=>m.t==='venta').forEach(v=>{const k=v.tipo+'|'+(v.precio||0);grupos[k]=grupos[k]||{tipo:v.tipo,precio:v.precio||0,qty:0,total:0};grupos[k].qty+=v.qty;grupos[k].total+=v.total;});
  const orden=TT.map(t=>t.id);
  const filasE=Object.values(grupos).sort((x,z)=>orden.indexOf(x.tipo)-orden.indexOf(z.tipo)||x.precio-z.precio)
    .map(g=>{const t=getT(g.tipo)||{label:g.tipo};return [t.label,String(g.qty),t.free?'Free':fp(g.precio),t.free?'-':fp(g.total)];});
  if(!filasE.length)filasE.push(['Sin ventas cargadas','','','']);
  tabla(['Tipo','Cant.','Valor','Total'],filasE,{columnStyles:{0:{cellWidth:78},1:{halign:'right'},2:{halign:'right'},3:{halign:'right',fontStyle:'bold'}}});
  y+=2;
  caja('CIERRE TOTAL',fp(N.vendido),{grueso:true,h:14,fsm:18});
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...GRIS);
  doc.text(`${N.qtyPaga} entradas pagas${N.qtyFree?` + ${N.qtyFree} free`:''} · solo venta de calle`,M,y+5);doc.setTextColor(...INK);y+=10;
  // ---- cómo entró la plata de la caja: transferencia y efectivo, bien marcados ----
  const bw2=(W-2*M-6)/2;
  [['TRANSFERENCIA',fp(N.transfer),'Ya está en la cuenta'],['EFECTIVO',fp(N.efectivo),'Cobrado en mano']].forEach((k,i)=>{const x=M+i*(bw2+6);
    doc.setDrawColor(...INK);doc.setLineWidth(.9);doc.setFillColor(...(i?[232,232,232]:[222,240,227]));doc.rect(x,y,bw2,22,'FD');
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...GRIS);doc.text(k[0],x+4,y+6.5);
    doc.setTextColor(...INK);doc.setFontSize(19);doc.text(k[1],x+4,y+15.5);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...GRIS);doc.text(k[2],x+4,y+20);doc.setTextColor(...INK);});
  y+=31;
  // ---- GASTOS pagados con el efectivo ----
  titulo('GASTOS');
  const gastos=[];
  vivos().filter(m=>m.t==='gasto').forEach(m=>gastos.push([(m.desc||'Gasto')+' ('+((cajas.find(c=>c.id===m.caja)||{}).nombre||'caja')+')',m.monto]));
  vivos().filter(m=>m.t==='gastoClub').forEach(m=>gastos.push([m.desc||'Gasto del club',m.monto]));
  if(N.sueldosCaja)gastos.push(['Sueldos pagados de la caja',N.sueldosCaja]);
  if(!gastos.length)gastos.push(['Sin gastos',0]);
  gastos.forEach(g=>linea('- '+g[0],fp(g[1]),{ind:6,gap:6}));
  y+=1;
  const totG=N.gastosRRPP+N.gastosClub+N.sueldosCaja;
  caja('TOTAL GASTOS',fp(totG),{h:11,fs:11,fsm:13,fill:[251,231,228]});
  y+=12;
  // ---- lo que debería haber → faltantes → entrega en efectivo ----
  const esperado=N.efectivo-totG;
  const real=N.hayConteo?N.contado:N.enMano;
  const dif=real-esperado;
  linea('Efectivo que debería haber',fp(esperado),{bold:true,fs:12});
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...GRIS);doc.text(`Efectivo ${fp(N.efectivo)} - total gastos ${fp(totG)}`,M+4,y-2.5);doc.setTextColor(...INK);y+=3;
  const quien=N.conDif.map(x=>`${x.c.nombre} ${difTexto(x.k.diferencia).toLowerCase()}`.replace(/−/g,'-'));
  if(N.pendientes.length)quien.push(`sin rendir: ${N.pendientes.map(x=>x.c.nombre).join(', ')}`);
  if(N.hayConteo&&!cuadra(N.difConteo))quien.push(`conteo de billetes ${difTexto(N.difConteo).toLowerCase()}`.replace(/−/g,'-'));
  const etq=dif>0&&!cuadra(dif)?'Sobrantes':'Faltantes';
  linea(etq,cuadra(dif)?'$0':fp(Math.abs(dif)),{bold:true,fs:12,color:cuadra(dif)?VERDE:ROJO});
  if(quien.length&&!cuadra(dif)){doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...ROJO);doc.text(quien.join(' · '),M+4,y-2.5,{maxWidth:W-2*M-8});doc.setTextColor(...INK);y+=4;}
  y+=2;
  caja('ENTREGA EN EFECTIVO',fp(real),{grueso:true,h:17,fs:13,fsm:21,fill:[255,243,196]});
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...GRIS);doc.text(N.hayConteo?'Según el conteo de billetes':'Según lo que entregaron las cajas (sin conteo de billetes)',M,y+4.5);doc.setTextColor(...INK);y+=12;
  if(N.sueldosZebra){y+=2;linea('Sueldos que paga Zebra (no salen de esta caja)',fp(N.sueldosZebra),{bold:true});}
  if(N.sueldosSinDef){linea('Sueldos sin definir quién paga',fp(N.sueldosSinDef),{bold:true,color:ROJO});}
  // ---- firmas ----
  y=Math.max(y+16,262);doc.setDrawColor(...INK);doc.setLineWidth(.3);doc.line(M,y,M+72,y);doc.line(W-M-72,y,W-M,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...GRIS);doc.text('Entregó (encargado de calle)',M,y+5);doc.text('Recibió (administración)',W-M-72,y+5);doc.setTextColor(...INK);

  // ================= HOJA 2: ANEXO =================
  doc.addPage();encabezado('Anexo: detalle por RRPP');
  titulo('SUELDOS');
  const sRows=N.cs.map(({c,k})=>[c.nombre,fp(n0(c.fijo)),`${k.qtyPaga} x ${fp(n0(c.comisTicket))}`,k.alpogo?`${k.alpogo} x ${fp(k.comisAlpogo)}`:'-',fp(k.comision),c.pago==='caja'?'De la caja':c.pago==='zebra'?'Paga Zebra':'Sin definir']);
  sRows.push(['TOTAL','','','',fp(N.sueldos),'']);
  tabla(['RRPP','Fijo','Calle','Alpogo','Total','Cómo se paga'],sRows,{styles:{fontSize:9,cellPadding:1.8,textColor:20,lineColor:190,lineWidth:.25},columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}},
    didParseCell:d=>{if(d.section==='body'&&d.row.index===sRows.length-1)d.cell.styles.fontStyle='bold';if(d.section==='body'&&d.column.index===5&&/Paga Zebra|Sin definir/.test(String(d.cell.raw))){d.cell.styles.fontStyle='bold';d.cell.styles.textColor=ROJO;}}});
  if(N.alpogo){y+=5;doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...GRIS);doc.text(`Alpogo: ${N.alpogo} entradas vendidas por los links de los RRPP. Esa plata la cobra la ticketera; acá solo se paga la comisión.`,M,y,{maxWidth:W-2*M});doc.setTextColor(...INK);}
  y+=10;titulo('CAJAS');
  const cRows=N.cs.map(({c,k})=>[c.nombre+(c.qr?' (QR '+c.qr+')':''),String(k.qtyPaga)+(k.qtyFree?` +${k.qtyFree}f`:''),fp(k.vendido),fp(k.transfer),fp(k.gastos),fp(k.aEntregar+k.aCuenta),fp(k.aCuenta+(k.entrego||0)),k.rendida?(cuadra(k.diferencia)?'Cuadra':difTexto(k.diferencia).replace(/−/g,'-')):(k.reabierta?'Volver a rendir':'Sin rendir')]);
  tabla(['RRPP','Entr.','Vendido','Transf.','Gastos','Debía entregar','Entregó','Estado'],cRows,{styles:{fontSize:8.5,cellPadding:1.7,textColor:20,lineColor:190,lineWidth:.25},columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}},
    didParseCell:d=>{if(d.section==='body'&&d.column.index===7&&!/Cuadra/.test(String(d.cell.raw))){d.cell.styles.textColor=ROJO;d.cell.styles.fontStyle='bold';}}});
  if(N.hayConteo){y+=10;titulo('CONTEO DE BILLETES');const b=noche.billetes||{};const br=DENOMS.filter(d=>pint(b[d])).map(d=>[fp(d),String(pint(b[d])),fp(d*pint(b[d]))]);br.push(['TOTAL','',fp(N.contado)]);
    tabla(['Billete','Cant.','Subtotal'],br,{tableWidth:90,styles:{fontSize:9,cellPadding:1.6,textColor:20,lineColor:190,lineWidth:.25},columnStyles:{1:{halign:'right'},2:{halign:'right'}},didParseCell:d=>{if(d.section==='body'&&d.row.index===br.length-1)d.cell.styles.fontStyle='bold';}});}
  const pages=doc.getNumberOfPages();for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(120);doc.text(`Zebra · Calle — ${fechaTxt(noche.fecha)} · hoja ${i} de ${pages}`,W-M,291,{align:'right'});doc.setTextColor(...INK);}
  return doc;
}
function descargarPdf(doc){doc.save(nombrePdf());}
// En el celu abre el menú de compartir (WhatsApp); en la PC descarga el PDF
function compartirPdf(){
  if(!pdfListo()){toast('Preparando el PDF… tocá de nuevo en unos segundos.',{err:true});cargarPdf().catch(()=>toast('No se pudo cargar el generador de PDF. Revisá internet.',{err:true}));return;}
  const doc=armarPdf();const name=nombrePdf();
  let file=null;try{file=new File([doc.output('blob')],name,{type:'application/pdf'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).catch(e=>{if(e&&e.name!=='AbortError'){descargarPdf(doc);toast('PDF descargado: adjuntalo en el WhatsApp de administración.');}});
  }else{descargarPdf(doc);toast('PDF descargado: adjuntalo en el WhatsApp de administración.');}
}

/* ================= EVENTOS ================= */
document.addEventListener('click',e=>{
  const stop=e.target.closest('[data-stop]');
  const el=e.target.closest('[data-a]');
  if(!el)return;
  if(stop&&el.classList.contains('sheet-bg'))return; // tocar dentro de la hoja no la cierra
  const a=el.dataset.a;if(A[a]&&!el.disabled){e.preventDefault();A[a](el.dataset.v);}
});
let precioT={},campoT={},rendT=null;
// Con el teclado abierto se esconde la barra de abajo y los botones dejan de flotar (no tapan el campo)
const esTexto=el=>el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!/^(button|checkbox|radio|submit)$/.test(el.type)));
document.addEventListener('focusin',e=>{if(esTexto(e.target))document.body.classList.add('kb');});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(!esTexto(document.activeElement))document.body.classList.remove('kb');},120);});
document.addEventListener('input',e=>{
  const el=e.target,i=el.dataset.i;if(!i)return;
  if(i==='entrego'){
    U.rendir.entrego=el.value;try{localStorage.setItem('calle_rend_'+U.caja,el.value);}catch(err){}
    const c=cajas.find(x=>x.id===U.caja);if(!c)return;const k=calcCaja(c);
    $('#statEntrego').innerHTML=statusRendir(k,el.value,false);
    const np=$('#notaPago');if(np&&c.pago)np.textContent=notaPago(c,k,el.value);
    clearTimeout(rendT);rendT=setTimeout(()=>{const c2=cajas.find(x=>x.id===U.caja);const s=$('#statEntrego');if(c2&&s)s.innerHTML=statusRendir(calcCaja(c2),U.rendir.entrego,true);},650);
  }
  else if(i==='precio'){const t=el.dataset.t,n=+el.dataset.n,v=pint(el.value);clearTimeout(precioT[t+n]);precioT[t+n]=setTimeout(()=>{
      const cur=preciosDe(t);const arr=[];for(let j=0;j<Math.max(cur.length,n+1);j++)arr[j]=j===n?v:(cur[j]||0);
      updNoche({['precios.'+t]:arr});},500);}
  else if(i==='nocheCampo'){const f=el.dataset.f,v=el.value;clearTimeout(campoT[f]);campoT[f]=setTimeout(()=>updNoche({[f]:v}),500);}
  else if(i==='billete'){const d=+el.dataset.d,v=pint(el.value);$('#bs_'+d).textContent=v?fmt(d*v):'—';let tot=0;DENOMS.forEach(x=>{const inp=$('#bi_'+x);tot+=x*pint(inp?inp.value:0);});$('#biTot').textContent=fmt(tot);}
});
document.addEventListener('focusout',e=>{
  if(e.target&&e.target.id==='entrego'){clearTimeout(rendT);const c=cajas.find(x=>x.id===U.caja);const s=$('#statEntrego');if(c&&s)s.innerHTML=statusRendir(calcCaja(c),U.rendir.entrego,true);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter&&A[e.target.dataset.enter]){e.preventDefault();A[e.target.dataset.enter]();return;}
  if(e.key==='Escape'&&U.sheet&&U.sheet.k!=='billetes'){U.sheet=null;renderOverlay();}
  if(e.key==='Enter'&&U.sheet&&e.target.tagName==='INPUT'){const b={monto:'guardarMonto',billetes:'guardarBilletes',nuevaNoche:'crearNuevaNoche'}[U.sheet.k];if(b){e.preventDefault();A[b]();}}
});

listen();
render();
